name: Docker deploy

on:
  workflow_call:
    inputs:
      ACCOUNT_ID:
        required: true
        type: string
      GITHUB_SHA:
        required: true
        type: string
    secrets:
      LOG_ANALYTICS_WORKSPACE_ID:
        required: true
      LOG_ANALYTICS_WORKSPACE_KEY:
        required: true

env:
  AWS_REGION: ca-central-1
  ECS_CLUSTER: idp
  REGISTRY_PREFIX: ${{ inputs.ACCOUNT_ID }}.dkr.ecr.ca-central-1.amazonaws.com
  GITHUB_SHA: ${{ inputs.GITHUB_SHA }}

jobs:
  docker-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Audit DNS requests
        uses: cds-snc/dns-proxy-action@9ad793100229573be3f5ba78cc69ec523f2c8b7e # v1.1.0
        env:
          DNS_PROXY_FORWARDTOSENTINEL: "true"
          DNS_PROXY_LOGANALYTICSWORKSPACEID: "${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}"
          DNS_PROXY_LOGANALYTICSSHAREDKEY: "${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}"
          DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
          DNS_PROXY_WILDCARDGREEDY: "true"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: arn:aws:iam::${{ inputs.ACCOUNT_ID }}:role/platform-unified-accounts-user-portal-apply
          role-session-name: DeployContainer
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@6853cfae8c3a7d978fbf68b5a55453395541dfbb # v1.8.5
        with:
          task-definition-family: idp-login
          container-name: idp-login
          image: ${{ env.REGISTRY_PREFIX }}/idp-login:sha-${{ env.GITHUB_SHA }}

      - name: Deploy updated ECS task
        uses: aws-actions/amazon-ecs-deploy-task-definition@a310a830f5c14e583e35d84e4e1ec7dd177c3c9c # v2.6.2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: idp-login
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          propagate-tags: SERVICE

      - name: Update SSM parameter for deployed image
        run: |
          aws ssm put-parameter \
            --name "/ecs/$ECS_CLUSTER/idp-login/container-image" \
            --value "$REGISTRY_PREFIX/idp-login:sha-$GITHUB_SHA" \
            --type "String" \
            --overwrite

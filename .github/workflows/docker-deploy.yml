name: Docker deploy

on:
  workflow_call:
    inputs:
      ACCOUNT_ID:
        required: true
        type: string
      IMAGE_TAG:
        required: true
        type: string
    secrets:
      SENTINEL_DCE_ENDPOINT:
        required: true

env:
  AWS_REGION: ca-central-1
  ECS_CLUSTER: idp
  REGISTRY_PREFIX: ${{ inputs.ACCOUNT_ID }}.dkr.ecr.ca-central-1.amazonaws.com
  IMAGE_TAG: ${{ inputs.IMAGE_TAG }}

jobs:
  docker-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Audit DNS requests
        uses: cds-snc/dns-proxy-action@58d95c286bfa233aec52055237b26a20c6ae13a5 # v1.2.1
        env:
          DNS_PROXY_FORWARDTOSENTINEL: "true"
          DNS_PROXY_SENTINELFORWARDINGMODE: "oidc"
          DNS_PROXY_SENTINELTENANTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_TENANT_ID }}"
          DNS_PROXY_SENTINELCLIENTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_CLIENT_ID }}"
          DNS_PROXY_SENTINELDCEURI: "${{ secrets.SENTINEL_DCE_ENDPOINT }}"
          DNS_PROXY_SENTINELDCRIMMUTABLEID: "${{ vars.SENTINEL_DCR_RULE_ID_DNS_PROXY }}"
          DNS_PROXY_SENTINELSTREAMNAME: Custom-GitHubMetadata_CI_DNS_Queries_V2_Input
          DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
          DNS_PROXY_WILDCARDGREEDY: "true"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ inputs.ACCOUNT_ID }}:role/platform-unified-accounts-user-portal-apply
          role-session-name: DeployContainer
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-family: idp-login
          container-name: idp-login
          image: ${{ env.REGISTRY_PREFIX }}/idp-login:${{ env.IMAGE_TAG }}

      - name: Deploy updated ECS task
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: idp-login
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
          propagate-tags: SERVICE

      - name: Update SSM parameter for deployed image
        run: |
          aws ssm put-parameter \
            --name "/ecs/$ECS_CLUSTER/idp-login/container-image" \
            --value "$REGISTRY_PREFIX/idp-login:$IMAGE_TAG" \
            --type "String" \
            --overwrite

name: Integration test Staging

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Docker deploy Staging"]
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  integration-test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/integration-test.yml
    with:
      account_id: ${{ vars.STAGING_AWS_ACCOUNT_ID }}
      account_region: ca-central-1
      bucket_name: ${{ vars.STAGING_INTEGRATION_TEST_BUCKET_NAME }}
      idp_url: ${{ vars.STAGING_INTEGRATION_TEST_IDP_URL }}
      portal_url: ${{ vars.STAGING_INTEGRATION_TEST_PORTAL_URL }}
    secrets:
      log_analytics_workspace_id: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
      log_analytics_workspace_key: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}
      username: ${{ secrets.STAGING_INTEGRATION_TEST_USERNAME }}
      password: ${{ secrets.STAGING_INTEGRATION_TEST_PASSWORD }}
      totp_secret: ${{ secrets.STAGING_INTEGRATION_TEST_TOTP_SECRET }}
      waf_geo_restriction_bypass: ${{ secrets.STAGING_WAF_GEO_RESTRICTION_BYPASS }}
      zitadel_bearer_token: ${{ secrets.STAGING_INTEGRATION_TEST_ZITADEL_BEARER_TOKEN }}

name: Docker update Production

concurrency:
  group: docker-update-production
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - .release-please-manifest.json

permissions: {}

jobs:
  get-version:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/get-version.yml
    secrets:
      SENTINEL_DCE_ENDPOINT: ${{ secrets.SENTINEL_DCE_ENDPOINT }}

  docker-build:
    needs: get-version
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/docker-build.yml
    with:
      ACCOUNT_ID: ${{ vars.PROD_AWS_ACCOUNT_ID }}
      GITHUB_SHA: ${{ needs.get-version.outputs.version }}
      IMAGE_TAG: ${{ needs.get-version.outputs.version }}
    secrets:
      SENTINEL_DCE_ENDPOINT: ${{ secrets.SENTINEL_DCE_ENDPOINT }}

  docker-deploy:
    needs: 
      - get-version
      - docker-build
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/docker-deploy.yml
    with:
      ACCOUNT_ID: ${{ vars.PROD_AWS_ACCOUNT_ID }}
      IMAGE_TAG: ${{ needs.get-version.outputs.version }}
    secrets:
      SENTINEL_DCE_ENDPOINT: ${{ secrets.SENTINEL_DCE_ENDPOINT }}

  docker-sbom:
    needs: 
      - get-version
      - docker-build
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/docker-sbom.yml
    with:
      GITHUB_SHA: ${{ needs.get-version.outputs.version }}
    secrets:
      SENTINEL_DCE_ENDPOINT: ${{ secrets.SENTINEL_DCE_ENDPOINT }}

  integration-test:
    needs:
      - docker-deploy
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/integration-test.yml
    with:
      account_id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
      bucket_name: ${{ vars.PROD_INTEGRATION_TEST_BUCKET_NAME }}
      idp_url: ${{ vars.PROD_INTEGRATION_TEST_IDP_URL }}
      portal_url: ${{ vars.PROD_INTEGRATION_TEST_PORTAL_URL }}
      test_command: "test:playwright:smoke"
    secrets:
      sentinel_dce_endpoint: ${{ secrets.SENTINEL_DCE_ENDPOINT }}
      register_email: ${{ secrets.PROD_INTEGRATION_TEST_REGISTER_EMAIL }}
      username: ${{ secrets.PROD_INTEGRATION_TEST_USERNAME }}
      password: ${{ secrets.PROD_INTEGRATION_TEST_PASSWORD }}
      test_callback_url: ${{ secrets.PROD_INTEGRATION_TEST_CALLBACK_URL }}
      test_client_id: ${{ secrets.PROD_INTEGRATION_TEST_CLIENT_ID }}
      totp_secret: ${{ secrets.PROD_INTEGRATION_TEST_TOTP_SECRET }}
      zitadel_organization_id: ${{ secrets.PROD_INTEGRATION_TEST_ZITADEL_ORGANIZATION_ID }}
      zitadel_service_account_key: ${{ secrets.PROD_INTEGRATION_TEST_ZITADEL_SERVICE_ACCOUNT_KEY }}

  workflow-failure:
    needs:
      - get-version
      - docker-build
      - docker-deploy
      - integration-test
    if: >-
      always() && (
        needs.get-version.result == 'failure' ||
        needs.docker-build.result == 'failure' ||
        needs.docker-deploy.result == 'failure' ||
        needs.integration-test.result == 'failure'
      )
    permissions:
      id-token: write
    uses: ./.github/workflows/workflow-failure.yml
    secrets:
      SENTINEL_DCE_ENDPOINT: ${{ secrets.SENTINEL_DCE_ENDPOINT }}
      SLACK_WEBHOOK_URL: ${{ secrets.PROD_CLOUDWATCH_ALERT_SLACK_WEBHOOK }}

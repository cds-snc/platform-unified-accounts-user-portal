name: Integration test

on:
  workflow_call:
    inputs:
      account_id:
        required: true
        type: string
      bucket_name:
        required: true
        type: string
      idp_url:
        required: true
        type: string
      portal_url:
        required: true
        type: string
    secrets:
      log_analytics_workspace_id:
        required: true
      log_analytics_workspace_key:
        required: true
      username:
        required: true
      password:
        required: true
      totp_secret:
        required: true
      waf_geo_restriction_bypass:
        required: true
      zitadel_bearer_token:
        required: true

env:
  AWS_REGION: ca-central-1

jobs:
  integration-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    container:
      # Playwright Docker image tag must match the pnpm-lock.yaml pinned version
      image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
    steps:
      - name: Audit DNS requests
        uses: cds-snc/dns-proxy-action@9ad793100229573be3f5ba78cc69ec523f2c8b7e # v1.1.0
        env:
          DNS_PROXY_FORWARDTOSENTINEL: "true"
          DNS_PROXY_LOGANALYTICSWORKSPACEID: "${{ secrets.log_analytics_workspace_id }}"
          DNS_PROXY_LOGANALYTICSSHAREDKEY: "${{ secrets.log_analytics_workspace_key }}"
          DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
          DNS_PROXY_WILDCARDGREEDY: "true"

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Run integration tests
        id: test
        env:
          IDP_URL: ${{ inputs.idp_url }}
          PORTAL_URL: ${{ inputs.portal_url }}
          USERNAME: ${{ secrets.username }}
          PASSWORD: ${{ secrets.password }}
          TOTP_SECRET: ${{ secrets.totp_secret }}
          WAF_GEO_RESTRICTION_BYPASS: ${{ secrets.waf_geo_restriction_bypass }}
          ZITADEL_BEARER_TOKEN: ${{ secrets.zitadel_bearer_token }}
        run: pnpm test:playwright

      - name: Configure AWS credentials using OIDC
        if: failure() && steps.test.outcome == 'failure'
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws:iam::${{ inputs.account_id }}:role/platform-unified-accounts-integration-tests
          role-session-name: IntegrationTests
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload test results
        if: failure() && steps.test.outcome == 'failure'
        env:
          BUCKET_NAME: ${{ inputs.bucket_name }}
        run: |
          DATE=$(date +"%Y-%m-%d")
          apt-get update && apt-get install -y unzip  
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip && ./aws/install
          aws s3 cp ./test-results s3://$BUCKET_NAME/$DATE/${{ github.run_id }} --recursive

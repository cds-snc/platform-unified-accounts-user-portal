name: Integration test

on:
  workflow_call:
    inputs:
      account_id:
        required: true
        type: string
      bucket_name:
        required: true
        type: string
      forms_url:
        required: true
        type: string
      idp_url:
        required: true
        type: string
      portal_url:
        required: true
        type: string
    secrets:
      log_analytics_workspace_id:
        required: true
      log_analytics_workspace_key:
        required: true
      register_email:
        required: true
      username:
        required: true
      password:
        required: true
      totp_secret:
        required: true
      zitadel_service_account_key:
        required: true

env:
  AWS_REGION: ca-central-1

jobs:
  integration-test:
    runs-on: codebuild-platform-unified-accounts-user-portal-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      id-token: write
      contents: read
    container:
      # Playwright Docker image tag must match the pnpm-lock.yaml pinned version
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - name: Audit DNS requests
        uses: cds-snc/dns-proxy-action@7b6ba63b4f045de61c98a3c1b99fdd08f32b0784 # v1.2.0
        env:
          DNS_PROXY_FORWARDTOSENTINEL: "true"
          DNS_PROXY_LOGANALYTICSWORKSPACEID: "${{ secrets.log_analytics_workspace_id }}"
          DNS_PROXY_LOGANALYTICSSHAREDKEY: "${{ secrets.log_analytics_workspace_key }}"
          DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
          DNS_PROXY_WILDCARDGREEDY: "true"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Run integration tests
        id: test
        env:
          FORMS_URL: ${{ inputs.forms_url }}
          IDP_URL: ${{ inputs.idp_url }}
          PORTAL_URL: ${{ inputs.portal_url }}
          REGISTER_EMAIL: ${{ secrets.register_email }}
          USERNAME: ${{ secrets.username }}
          PASSWORD: ${{ secrets.password }}
          TOTP_SECRET: ${{ secrets.totp_secret }}
          ZITADEL_SERVICE_ACCOUNT_KEY: ${{ secrets.zitadel_service_account_key }}
        run: pnpm test:playwright

      - name: Configure AWS credentials using OIDC
        if: failure() && steps.test.outcome == 'failure'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.account_id }}:role/platform-unified-accounts-integration-tests
          role-session-name: IntegrationTests
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload test results
        if: failure() && steps.test.outcome == 'failure'
        env:
          BUCKET_NAME: ${{ inputs.bucket_name }}
        run: |
          find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i 's|http://|https://|g' {} +
          apt-get update && apt-get install -y --no-install-recommends unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip && ./aws/install
          aws s3 cp ./test-results s3://$BUCKET_NAME/$(date +"%Y-%m-%d")/${{ github.run_id }} --recursive

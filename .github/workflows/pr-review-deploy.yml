name: PR review deploy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

env:
  AWS_REGION: ca-central-1
  FUNCTION_NAME: idp-login-pr
  GITHUB_SHA: ${{ github.sha }}
  IMAGE: idp-login-pr
  REGISTRY_PREFIX: ${{ vars.STAGING_AWS_ACCOUNT_ID }}.dkr.ecr.ca-central-1.amazonaws.com
  ROLE_ARN: arn:aws:iam::${{ vars.STAGING_AWS_ACCOUNT_ID }}:role/idp-login-pr

permissions: {}

jobs:
  pr-review-build:
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Audit DNS requests
        uses: cds-snc/dns-proxy-action@7b6ba63b4f045de61c98a3c1b99fdd08f32b0784 # v1.2.0
        env:
          DNS_PROXY_FORWARDTOSENTINEL: "true"
          DNS_PROXY_LOGANALYTICSWORKSPACEID: "${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}"
          DNS_PROXY_LOGANALYTICSSHAREDKEY: "${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}"
          DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
          DNS_PROXY_WILDCARDGREEDY: "true"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.STAGING_AWS_ACCOUNT_ID }}:role/platform-unified-accounts-user-portal-pr-review-deploy
          role-session-name: PRReviewECRPush
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set envs
        run: echo "PR_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")" >> $GITHUB_ENV

      - name: Delete old images
        run: |
          IMAGES_TO_DELETE="$(aws ecr list-images --repository-name $IMAGE --filter "tagStatus=TAGGED" --query "imageIds[?starts_with(imageTag, 'pr-$PR_NUMBER')]" --output json)"
          aws ecr batch-delete-image \
            --repository-name $IMAGE \
            --image-ids "$IMAGES_TO_DELETE" || true

      - name: Build and push image
        run: |
          docker buildx build \
            --push \
            --provenance=false \
            --platform linux/arm64 \
            --build-arg GIT_SHA=$GITHUB_SHA \
            -t "$REGISTRY_PREFIX/$IMAGE:pr-$PR_NUMBER-$GITHUB_SHA" \
            -f Dockerfile.pr \
            .

  pr-review-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
    needs: pr-review-build
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Audit DNS requests
        uses: cds-snc/dns-proxy-action@7b6ba63b4f045de61c98a3c1b99fdd08f32b0784 # v1.2.0
        env:
          DNS_PROXY_FORWARDTOSENTINEL: "true"
          DNS_PROXY_LOGANALYTICSWORKSPACEID: "${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}"
          DNS_PROXY_LOGANALYTICSSHAREDKEY: "${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}"
          DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
          DNS_PROXY_WILDCARDGREEDY: "true"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.STAGING_AWS_ACCOUNT_ID }}:role/platform-unified-accounts-user-portal-pr-review-deploy
          role-session-name: PRReviewDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Set envs
        run: echo "PR_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")" >> $GITHUB_ENV

      - name: Deploy the review environment
        id: deploy
        run: |
          URL=$(.github/workflows/scripts/pr-review-deploy.sh \
            "$FUNCTION_NAME-$PR_NUMBER" \
            "$REGISTRY_PREFIX/$IMAGE:pr-$PR_NUMBER-$GITHUB_SHA" \
            "$ROLE_ARN" \
            "${{ secrets.PR_REVIEW_ENV_SUBNET_IDS }}" \
            "${{ secrets.PR_REVIEW_ENV_SECURITY_GROUP_IDS }}" \
            "${{ vars.STAGING_INTEGRATION_TEST_URL }}")
          echo "URL=$URL" >> $GITHUB_OUTPUT

      - name: PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commentId = "<!--pr-url-->";
            const url = process.env.URL;
            const pr = {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            };
            const comments = await github.paginate(github.rest.issues.listComments, pr);
            const isComment = comments.some(comment => comment.body.includes(commentId));
            if (!isComment) {
              github.rest.issues.createComment({
                ...pr,
                body: `${commentId}\n## :test_tube: Review environment\n${url}ui/v2`
              });
            }

  pr-integration-test:
    needs: pr-review-deploy
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/integration-test.yml
    with:
      account_id: ${{ vars.STAGING_AWS_ACCOUNT_ID }}
      bucket_name: ${{ vars.STAGING_INTEGRATION_TEST_BUCKET_NAME }}
      idp_url: ${{ vars.STAGING_INTEGRATION_TEST_IDP_URL }}
      portal_url: ${{ needs.pr-review-deploy.outputs.url }}ui/v2
    secrets:
      log_analytics_workspace_id: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
      log_analytics_workspace_key: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}
      username: ${{ secrets.STAGING_INTEGRATION_TEST_USERNAME }}
      password: ${{ secrets.STAGING_INTEGRATION_TEST_PASSWORD }}
      totp_secret: ${{ secrets.STAGING_INTEGRATION_TEST_TOTP_SECRET }}
      waf_geo_restriction_bypass: ${{ secrets.STAGING_WAF_GEO_RESTRICTION_BYPASS }}
      zitadel_service_account_key: ${{ secrets.STAGING_INTEGRATION_TEST_ZITADEL_SERVICE_ACCOUNT_KEY }}
